events { worker_connections 1024; }
http {
  access_log off;
  resolver 127.0.0.11 valid=2s ipv6=off;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 40s;
  proxy_set_header Connection "";
  server { listen 8080; location / { set $upstream http://gateway-a:8080; proxy_pass $upstream; } }
  server { listen 8083; location / { set $upstream http://gateway-b:8080; proxy_pass $upstream; } }
  server { listen 8081; location / { set $upstream http://control:8081; proxy_pass $upstream; } }
  server { listen 8082; location / { set $upstream http://worker:8082; proxy_pass $upstream; } }
  server { listen 8084; location / { set $upstream http://baseline:8080; proxy_pass $upstream; } }
  server { listen 8085; location / { set $upstream http://candidate:8080; proxy_pass $upstream; } }
  server { listen 3000; location / { set $upstream http://grafana:3000; proxy_pass $upstream; } }
  server { listen 9090; location / { set $upstream http://prometheus:9090; proxy_pass $upstream; } }
}
