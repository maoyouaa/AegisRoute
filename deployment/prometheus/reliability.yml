global:
  scrape_interval: 2s
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: [gateway-a:8080, gateway-b:8080]
    metrics_path: /actuator/prometheus
  - job_name: control
    static_configs:
      - targets: [control:8081]
    metrics_path: /actuator/prometheus
  - job_name: worker
    static_configs:
      - targets: [worker:8082]
    metrics_path: /actuator/prometheus
  - job_name: redpanda
    static_configs:
      - targets: [redpanda:9644]
    metrics_path: /public_metrics
