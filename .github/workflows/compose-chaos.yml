name: Compose smoke and chaos

on:
  pull_request:
    paths:
      - "apps/**"
      - "modules/**"
      - "deployment/**"
      - "compose*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker compose up --build --wait --scale gateway=2
      - name: Exercise rollback and failure isolation
        shell: pwsh
        run: ./scripts/acceptance.ps1
      - name: Save topology evidence
        if: always()
        run: |
          mkdir -p build-evidence/compose
          docker compose ps --format json > build-evidence/compose/ps.json
          docker compose logs --no-color > build-evidence/compose/logs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compose-two-gateway-evidence
          path: build-evidence/compose
      - if: always()
        run: docker compose down --volumes
