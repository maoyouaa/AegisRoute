name: Compose smoke and chaos

on:
  pull_request:
    paths:
      - "apps/**"
      - "modules/**"
      - "deployment/**"
      - "compose*.yml"
      - "contracts/**"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "scripts/reliability/**"
      - "scripts/acceptance.ps1"
      - ".github/workflows/compose-chaos.yml"
      - "scripts/verify-compose-runtime-policy.ps1"
      - "scripts/verify-compose-crash-recovery.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Exercise v2 transport, durable evidence, rollback and automatic dependency recovery
        run: python3 scripts/reliability/run.py --project aegis-ci-${{ github.run_id }}-${{ github.run_attempt }} --output build-evidence/compose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compose-two-gateway-evidence
          path: build-evidence/compose
