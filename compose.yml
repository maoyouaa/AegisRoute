name: aegisroute

x-java-service: &java-service
  restart: unless-stopped
  networks:
    - aegis-internal

services:
  edge:
    image: nginx:1.29.0-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - aegis-entry

  gateway:
    <<: *java-service
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        APP: gateway
    expose:
      - "8080"
    environment:
      AEGIS_CONTROL_BASE_URL: http://control:8081
      AEGIS_REDPANDA_BOOTSTRAP: redpanda:9092
    depends_on:
      - control
      - redpanda
    networks:
      - aegis-entry
      - aegis-internal

  control:
    <<: *java-service
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        APP: control
    expose:
      - "8081"
    environment:
      AEGIS_DATABASE_URL: jdbc:postgresql://postgres:5432/aegisroute
      AEGIS_DATABASE_USERNAME: aegis
      AEGIS_DATABASE_PASSWORD: aegis-local-only
      AEGIS_DEMO_BOOTSTRAP: "true"
      AEGIS_DEMO_BASELINE_BASE_URL: http://baseline:8080
      AEGIS_DEMO_CANDIDATE_BASE_URL: http://candidate:8080
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *java-service
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        APP: worker
    expose:
      - "8082"
    environment:
      AEGIS_CONTROL_BASE_URL: http://control:8081
      AEGIS_CANDIDATE_BASE_URL: http://candidate:8080
      AEGIS_REDPANDA_BOOTSTRAP: redpanda:9092
    depends_on:
      - control
      - redpanda
      - candidate

  baseline:
    <<: *java-service
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        APP: mock-provider
    expose:
      - "8080"
    environment:
      AEGIS_MOCK_NAME: baseline
      AEGIS_MOCK_FAIL_EVERY: "0"
      AEGIS_MOCK_RESPONSE_TEXT: Synthetic baseline response

  candidate:
    <<: *java-service
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        APP: mock-provider
    expose:
      - "8080"
    environment:
      AEGIS_MOCK_NAME: candidate
      AEGIS_MOCK_FAIL_EVERY: "3"
      AEGIS_MOCK_RESPONSE_TEXT: Synthetic candidate response

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: aegisroute
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegisroute"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aegis-internal

  redpanda:
    image: redpandadata/redpanda:v25.2.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
    expose:
      - "9092"
      - "9644"
    networks:
      - aegis-internal

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose:
      - "9090"
    networks:
      - aegis-internal

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: aegis-local-only
    volumes:
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    networks:
      - aegis-internal

networks:
  aegis-entry:
  aegis-internal:
    internal: true

volumes:
  postgres-data:
